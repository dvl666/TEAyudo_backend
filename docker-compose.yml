services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "${DB_USERNAME:-dvl}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-666}"
      POSTGRES_DB: "${DB_DATABASE:-appdb}"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
